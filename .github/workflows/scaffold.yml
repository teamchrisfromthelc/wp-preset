# Verifies the preset the only way that means anything: by scaffolding it into a
# temp dir and running every gate a real project would run. Per AGENTS.md, this
# repo has no vendor/ and its linters are templates — running them here proves
# nothing. Several past bugs passed a syntax check and only failed on a real
# install.
#
# The matrix is not decoration. setup.sh drives sed, and BSD/macOS and GNU sed
# disagree about `-i`; a fix verified on one platform can be broken on the other.
name: Scaffold

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a PR makes the first run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scaffold:
    name: ${{ matrix.os }} / ${{ matrix.kind }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel macOS when Linux fails. When a failure is platform-specific
      # the other leg's result is the diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # theme splits by kind: a block and a classic theme carry different
        # template files, and WordPress rejects a theme carrying neither.
        kind: [plugin, block, classic]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          # mbstring: PHPUnit refuses to start without it and Composer blocks
          # install. dom/xml/tokenizer/simplexml back PHPUnit and PHPCS.
          extensions: mbstring, dom, xml, tokenizer, simplexml
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scaffold into a temp dir
        shell: bash
        run: |
          set -euo pipefail
          # Outside the repo, so nothing here leaks into the scaffolded project.
          TARGET="$RUNNER_TEMP/scaffolded"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          ./setup.sh --${{ matrix.kind }} "$TARGET" acme-widgets

      - name: No placeholders survive the rename
        shell: bash
        run: |
          set -euo pipefail
          cd "$TARGET"
          # The bug class this repo keeps hitting: sed reports success while
          # rewriting nothing, so assert on content rather than exit codes.
          # --exclude-dir covers a re-run against an already-installed tree.
          if grep -rInE 'wp-project|wp_project|WP_PROJECT_|WpProject|WP Project' . \
               --exclude-dir=vendor --exclude-dir=node_modules --exclude-dir=dist; then
            echo "::error::Unrewritten placeholders above. See issue #3."
            exit 1
          fi
          echo "No placeholders remain."

      - name: Scaffolded project has the right shape
        shell: bash
        run: |
          set -euo pipefail
          cd "$TARGET"

          # setup.sh must never copy its own docs into a project (AGENTS.md).
          for f in README.md skill; do
            if [ -e "$f" ]; then
              echo "::error::$f was copied into the project; it must not be."
              exit 1
            fi
          done

          # The theme skills write measurement output to .verify/, which must
          # never be committed. The .gitignore is shared by both kinds.
          grep -qx '.verify/' .gitignore \
            || { echo "::error::.gitignore does not ignore .verify/"; exit 1; }

          if [ "${{ matrix.kind }}" != "plugin" ]; then
            [ -f style.css ] || { echo "::error::theme missing style.css"; exit 1; }
            # Theme-only Claude Code skills. A missing SKILL.md means copy_tree
            # in setup.sh silently copied nothing. block-theme-editor-ux assumes
            # theme.json and the Site Editor, so a classic theme must not get it.
            [ -f .claude/skills/figma-to-wordpress/SKILL.md ] \
              || { echo "::error::theme missing .claude/skills/figma-to-wordpress"; exit 1; }
            if [ "${{ matrix.kind }}" = "block" ]; then
              [ -f .claude/skills/block-theme-editor-ux/SKILL.md ] \
                || { echo "::error::block theme missing .claude/skills/block-theme-editor-ux"; exit 1; }
            elif [ -e .claude/skills/block-theme-editor-ux ]; then
              echo "::error::classic theme received block-theme-editor-ux"; exit 1
            fi
            # The MIT notice has to travel with the vendored copy.
            [ -f .claude/skills/figma-to-wordpress/LICENSE ] \
              || { echo "::error::figma-to-wordpress copied without its LICENSE"; exit 1; }
            [ -f functions.php ] || { echo "::error::theme missing functions.php"; exit 1; }
            grep -q '"type": "wordpress-theme"' composer.json \
              || { echo "::error::composer.json not retyped to wordpress-theme"; exit 1; }
            # Regression test for issue #8: the sed pattern expected [ "." ] while
            # the file held ["."], so this silently no-opped and every scaffolded
            # theme mounted as a plugin.
            grep -q '"themes"' .wp-env.json \
              || { echo "::error::.wp-env.json still mounts as a plugin. See issue #8."; exit 1; }

            # WordPress refuses to register a theme carrying neither
            # templates/index.html nor index.php. Every scaffolded theme was
            # invalid until this was fixed. See issue #15.
            if [ "${{ matrix.kind }}" = "block" ]; then
              [ -f theme.json ] || { echo "::error::block theme missing theme.json"; exit 1; }
              [ -f templates/index.html ] \
                || { echo "::error::block theme missing templates/index.html. See issue #15."; exit 1; }
              if [ ! -f parts/header.html ] || [ ! -f parts/footer.html ]; then
                echo "::error::block theme missing template parts"; exit 1
              fi
              # The two kinds must not be mixed: index.php would take priority
              # over the block template and silently change how pages render.
              if [ -f index.php ]; then
                echo "::error::block theme also has index.php"; exit 1
              fi
              python3 -c "import json,sys; json.load(open('theme.json'))" \
                || { echo "::error::theme.json is not valid JSON"; exit 1; }
              # The schema version must not exceed what the theme's own
              # "Requires at least" supports. WordPress passes a too-new
              # version through unmigrated rather than erroring, so this is
              # silent. A v2 file is migrated forward automatically.
              SCHEMA=$(python3 -c "import json;print(json.load(open('theme.json'))['version'])")
              [ "$SCHEMA" = "2" ] \
                || { echo "::error::theme.json version $SCHEMA is newer than the 6.5 floor supports"; exit 1; }
            else
              [ -f index.php ] \
                || { echo "::error::classic theme missing index.php. See issue #15."; exit 1; }
              if [ ! -f header.php ] || [ ! -f footer.php ]; then
                echo "::error::classic theme missing header.php/footer.php"; exit 1
              fi
              if [ -f theme.json ]; then
                echo "::error::classic theme also has theme.json"; exit 1
              fi
              grep -q 'after_setup_theme' functions.php \
                || { echo "::error::classic theme has no theme supports registered"; exit 1; }
            fi
          else
            [ -f acme-widgets.php ] || { echo "::error::plugin missing acme-widgets.php"; exit 1; }
            grep -q '"type": "wordpress-plugin"' composer.json \
              || { echo "::error::composer.json is not typed wordpress-plugin"; exit 1; }
            grep -q '"plugins"' .wp-env.json \
              || { echo "::error::.wp-env.json should mount as a plugin"; exit 1; }
            # The skills are theme-only: a plugin has no front end to measure.
            if [ -e .claude/skills ]; then
              echo "::error::plugin received the theme skills"; exit 1
            fi
          fi

      - name: composer install
        working-directory: ${{ env.TARGET }}
        run: composer install --no-interaction --no-progress

      - name: npm install
        working-directory: ${{ env.TARGET }}
        run: npm install --no-audit --no-fund

      # Each gate runs independently so one failure doesn't mask the rest.
      - name: composer test
        working-directory: ${{ env.TARGET }}
        run: composer test

      - name: phpcs
        working-directory: ${{ env.TARGET }}
        run: composer phpcs

      - name: phpstan
        working-directory: ${{ env.TARGET }}
        run: composer phpstan

      - name: lint:js
        working-directory: ${{ env.TARGET }}
        run: npm run lint:js

      - name: lint:css
        working-directory: ${{ env.TARGET }}
        run: npm run lint:css

      - name: format:check
        working-directory: ${{ env.TARGET }}
        run: npm run format:check

      # Intelephense skips any file over files.maxSize (1 MB by default), and the
      # WordPress stubs PHPStan installs are about 6 MB, so the editor reports
      # undefined symbols while PHPStan passes. The limit is compared with the
      # installed stub rather than a constant, so it stays true if the stub grows.
      # See issue #36.
      - name: Editor settings let Intelephense index the stubs
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          [ -f .vscode/settings.json ] \
            || { echo "::error::.vscode/settings.json was not scaffolded"; exit 1; }
          STUB=vendor/php-stubs/wordpress-stubs/wordpress-stubs.php
          SIZE=$(wc -c < "$STUB" | tr -d '[:space:]')
          FLOOR=$(php -r '
            $c = json_decode(file_get_contents("composer.json"), true);
            echo ltrim(preg_replace("/[^0-9.]/", "", $c["require"]["php"]), ".");
          ')
          php -r '
            $s = json_decode(file_get_contents(".vscode/settings.json"), true);
            if (!is_array($s)) { fwrite(STDERR, "settings.json is not valid JSON\n"); exit(1); }
            $size = (int) $argv[1];
            $max = $s["intelephense.files.maxSize"] ?? 0;
            if (!is_int($max) || $max < $size) {
              fwrite(STDERR, "maxSize $max is below the stub size $size\n"); exit(1);
            }
            $want = $argv[2] . ".0";
            $got = $s["intelephense.environment.phpVersion"] ?? "";
            if ($got !== $want) {
              fwrite(STDERR, "phpVersion is $got, the PHP floor is $want\n"); exit(1);
            }
          ' "$SIZE" "$FLOOR" || { echo "::error::.vscode/settings.json is wrong"; exit 1; }
          echo "maxSize covers the $SIZE byte stub; phpVersion matches PHP $FLOOR."

      # The entry point requires vendor/autoload.php. Without a psr-4 map that
      # require succeeds while registering nothing, so classes in includes/
      # never load — and every linter still passes, because they read files
      # directly rather than autoloading them. See issue #14.
      - name: includes/ is PSR-4 autoloaded
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            require "vendor/autoload.php";
            if ( ! class_exists( "AcmeWidgets\\Example" ) ) {
              fwrite( STDERR, "includes/ is not autoloaded\n" );
              exit( 1 );
            }
            echo "AcmeWidgets\\Example autoloaded\n";
          '
          # A class named the WordPress way must NOT resolve, which is why the
          # FileName sniff is disabled for this directory.
          cat > includes/Renamed.php <<'PHP'
          <?php
          /**
           * Probe.
           *
           * @package AcmeWidgets
           */

          namespace AcmeWidgets;

          /**
           * Probe class.
           */
          class Renamed {}
          PHP
          composer dump-autoload -q
          php -r '
            require "vendor/autoload.php";
            if ( ! class_exists( "AcmeWidgets\\Renamed" ) ) {
              fwrite( STDERR, "a new class in includes/ did not autoload\n" );
              exit( 1 );
            }
          '
          # PSR-4 filenames must survive phpcs, or the convention is unusable.
          vendor/bin/phpcs includes/ \
            || { echo "::error::phpcs rejects PSR-4 filenames in includes/"; exit 1; }
          rm -f includes/Renamed.php
          composer dump-autoload -q

      # "Sanitize on input" has to be enforced, not just documented.
      # WordPress-Extra ships EscapeOutput and NonceVerification but not
      # ValidatedSanitizedInput, so a nonce-checked handler could write raw
      # $_POST to the database and still pass phpcs.
      - name: Unsanitized input is rejected
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail

          # Nonce-checked, but the value goes in raw.
          cat > sniff-probe.php <<'PHP'
          <?php
          /**
           * Probe.
           *
           * @package AcmeWidgets
           */

          /**
           * Saves a value.
           *
           * @return void
           */
          function acme_widgets_probe_save() {
          	if ( ! isset( $_POST['n'] ) || ! wp_verify_nonce( sanitize_text_field( wp_unslash( $_POST['n'] ) ), 'a' ) ) {
          		return;
          	}
          	update_option( 'acme_widgets_name', $_POST['name'] );
          }
          PHP
          # Assert on the specific sniff codes, not just a non-zero exit:
          # an unrelated violation would otherwise make this pass with the
          # sniff removed entirely.
          SRC=$(vendor/bin/phpcs sniff-probe.php --report=source 2>/dev/null || true)
          for code in InputNotValidated MissingUnslash InputNotSanitized; do
            grep -q "WordPress.Security.ValidatedSanitizedInput.$code" <<<"$SRC" \
              || { echo "::error::ValidatedSanitizedInput.$code did not fire on unsanitized \$_POST"; \
                   echo "$SRC"; exit 1; }
          done

          # The same handler written correctly must pass, or the rule is
          # unusable rather than strict.
          cat > sniff-probe.php <<'PHP'
          <?php
          /**
           * Probe.
           *
           * @package AcmeWidgets
           */

          /**
           * Saves a value.
           *
           * @return void
           */
          function acme_widgets_probe_save() {
          	if ( ! isset( $_POST['n'] ) || ! wp_verify_nonce( sanitize_text_field( wp_unslash( $_POST['n'] ) ), 'a' ) ) {
          		return;
          	}
          	$name = isset( $_POST['name'] ) ? sanitize_text_field( wp_unslash( $_POST['name'] ) ) : '';
          	update_option( 'acme_widgets_name', $name );
          }
          PHP
          vendor/bin/phpcs sniff-probe.php \
            || { echo "::error::phpcs rejects correctly sanitized input"; exit 1; }

          rm -f sniff-probe.php

      # The README tells users to comment out WordPress-Docs when docblock rules
      # are more than they want. That has to actually loosen them. Docs is the
      # only standard pulling in Squiz.Commenting, and it applies ~35 WordPress
      # exclusions; referencing the sniff separately re-adds it bare, so
      # disabling Docs would demand @subpackage tags and reject
      # /* translators: */ comments. See issue #5.
      - name: Disabling WordPress-Docs loosens docblock rules
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          # The scaffolded dir is not a git checkout, so keep a copy to restore
          # from; later steps lint this project and must see the real config.
          cp phpcs.xml.dist phpcs.xml.dist.orig
          # Exercises what WordPress-Docs excludes: a translators comment, and
          # a documented function with no @return.
          cat > docblock-probe.php <<'PHP'
          <?php
          /**
           * Probe file.
           *
           * @package AcmeWidgets
           */

          /**
           * Echo a greeting.
           *
           * @param string $name Name.
           */
          function acme_widgets_probe( $name ) {
          	/* translators: %s: person name */
          	printf( esc_html__( 'Hello %s', 'acme-widgets' ), esc_html( $name ) );
          }
          PHP

          vendor/bin/phpcs docblock-probe.php \
            || { echo "::error::probe fails with WordPress-Docs enabled"; exit 1; }

          # Comment the rule out exactly as the README instructs.
          php -r '
            $f = "phpcs.xml.dist";
            $s = file_get_contents($f);
            $s = preg_replace(
              "#\t<rule ref=\"WordPress-Docs\">.*?\t</rule>#s",
              "\t<!-- disabled by CI -->",
              $s,
              1,
              $n
            );
            if ($n !== 1) {
              fwrite(STDERR, "could not find the WordPress-Docs rule to disable\n");
              exit(1);
            }
            file_put_contents($f, $s);
          '

          if ! vendor/bin/phpcs docblock-probe.php; then
            echo "::error::Disabling WordPress-Docs made docblock rules stricter. See issue #5."
            exit 1
          fi

          rm -f docblock-probe.php
          mv phpcs.xml.dist.orig phpcs.xml.dist

      # Root dotfiles the build has never heard of. The exclude used to name each
      # dotfile, so .gitattributes shipped until someone added it by hand. The
      # build now drops every root dotfile, and the zip assertion below checks
      # that rule rather than a list of names. See issue #28.
      - name: Add unknown root dotfiles
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          echo '.gitattributes export-ignore' > .gitattributes
          echo 'lts/*' > .somefuturetool
          mkdir -p .storybook && echo 'export default {};' > .storybook/main.js

      # The build excluded phpstan.neon* only, so a project that ran
      # --generate-baseline shipped phpstan-baseline.neon.
      - name: Add a PHPStan baseline
        working-directory: ${{ env.TARGET }}
        run: |
          printf 'parameters:\n\tignoreErrors: []\n' > phpstan-baseline.neon

      # bin/build.sh packages both kinds, detecting which from the headers.
      - name: composer build
        working-directory: ${{ env.TARGET }}
        run: composer build

      - name: Built zip is installable
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(ls dist/*.zip)
          echo "Built: $ZIP"
          # WordPress requires a single top-level <slug>/ directory.
          TOP=$(unzip -Z1 "$ZIP" | cut -d/ -f1 | sort -u)
          [ "$TOP" = "acme-widgets" ] \
            || { echo "::error::zip top level is '$TOP', expected 'acme-widgets'"; exit 1; }
          # Dev tooling must never ship.
          if unzip -Z1 "$ZIP" | grep -E '(^|/)(node_modules|tests)/|\.dist$|\.neon$'; then
            echo "::error::dev tooling in the release zip"
            exit 1
          fi
          # No dotfile or dot-directory ships from the project's own tree.
          # vendor/ is the packages' business, so it is left out of the check.
          if unzip -Z1 "$ZIP" | grep -v '^acme-widgets/vendor/' | grep -E '(^|/)\.[^/]+'; then
            echo "::error::dotfile in the release zip"
            exit 1
          fi
          # Editor settings are for the developer. The dotfile rule covers
          # them, but name it so a change to that rule cannot drop it quietly.
          if unzip -Z1 "$ZIP" | grep -q '\.vscode'; then
            echo "::error::.vscode/ shipped in the release zip"
            exit 1
          fi
          # Each kind must carry its own entry point.
          if [ "${{ matrix.kind }}" != "plugin" ]; then
            # Theme review rejects a theme missing any of these, and Theme
            # Check reads the zip, so they have to survive the build.
            for f in style.css readme.txt screenshot.png; do
              unzip -Z1 "$ZIP" | grep -qx "acme-widgets/$f" \
                || { echo "::error::theme zip missing $f"; exit 1; }
            done
          else
            unzip -Z1 "$ZIP" | grep -q '^acme-widgets/acme-widgets\.php$' \
              || { echo "::error::plugin zip missing acme-widgets.php"; exit 1; }
            # wordpress.org reads readme.txt from the uploaded zip, so a build
            # that drops it produces a listing with no description at all.
            unzip -Z1 "$ZIP" | grep -q '^acme-widgets/readme\.txt$' \
              || { echo "::error::plugin zip missing readme.txt"; exit 1; }
            # A vendor/ with no composer.json beside it is what Plugin Check
            # reports as missing_composer_json_file: a reviewer cannot tell what
            # the bundled code is. The build used to delete it.
            if unzip -Z1 "$ZIP" | grep -q '^acme-widgets/vendor/'; then
              unzip -Z1 "$ZIP" | grep -q '^acme-widgets/composer\.json$' \
                || { echo "::error::zip ships vendor/ with no composer.json beside it"; exit 1; }
            fi
          fi
          # composer.lock pins dev versions and says nothing about the release.
          if unzip -Z1 "$ZIP" | grep -q 'composer\.lock$'; then
            echo "::error::composer.lock shipped in the release zip"
            exit 1
          fi

      # Once src/ exists the build compiles it, and src/ never ships, so the
      # compiled build/ must reach the zip.
      - name: Assets in src/ are compiled into the zip
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir src
          printf 'window.acmeWidgets = true;\n' > src/index.js
          rm -f dist/*.zip
          composer build
          unzip -Z1 dist/*.zip | grep -qx 'acme-widgets/build/index.js' \
            || { unzip -Z1 dist/*.zip; echo "::error::compiled build/index.js missing from the zip"; exit 1; }
          if unzip -Z1 dist/*.zip | grep -q '^acme-widgets/src/'; then
            echo "::error::src/ shipped in the release zip"; exit 1
          fi
          rm -rf src build dist/*.zip
          echo "src/index.js compiled to build/index.js and shipped."

      # With src/ present and node_modules missing, the build warned, exited 0
      # and shipped a zip with no compiled assets, or a stale build/ if one was
      # there. See issue #34. Its own scaffold, never npm-installed.
      - name: A production build refuses to skip the asset compile
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = "plugin" ]; then
            FLAGS=(--plugin)
          else
            FLAGS=(--theme "--${{ matrix.kind }}")
          fi
          DIR="$RUNNER_TEMP/assets-probe"
          ./setup.sh "${FLAGS[@]}" "$DIR" acme-widgets >/dev/null
          cd "$DIR"
          mkdir src
          printf 'window.acmeWidgets = true;\n' > src/index.js

          fail() { echo "::error::$*"; exit 1; }

          # expect_refusal <label>
          expect_refusal() {
            local out
            if out=$(bash bin/build.sh 2>&1); then
              fail "$1: build.sh exited 0 without compiling src/"
            fi
            grep -q "node_modules is missing" <<<"$out" \
              || { echo "$out"; fail "$1: failed without its diagnostic"; }
            if ls dist/*.zip >/dev/null 2>&1; then
              fail "$1: a zip was written anyway"
            fi
            echo "  $1: refused"
          }

          expect_refusal "no build/"

          mkdir build
          printf 'window.stale = true;\n' > build/index.js
          expect_refusal "stale build/"

          # --dev is the explicit opt-out and still builds.
          bash bin/build.sh --dev >/dev/null \
            || fail "--dev no longer skips the asset build"
          [ -f dist/acme-widgets-0.1.0.zip ] || fail "--dev wrote no zip"
          echo "  --dev: built without compiling"

      # build.sh compares the *_VERSION constant with the Version: header, but
      # matched the name with [A-Z_]+. A slug or --prefix containing a digit
      # produced a constant the pattern never matched, so a stale constant
      # built and shipped with exit 0. See issue #32. Each probe gets its own
      # scaffold: digit-free, digit in the slug, digit in --prefix.
      - name: Version constant must match the header
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = "plugin" ]; then
            FLAGS=(--plugin)
          else
            FLAGS=(--theme "--${{ matrix.kind }}")
          fi

          fail() { echo "::error::$*"; exit 1; }

          # probe <name> <slug> <constant> [setup.sh options...]
          probe() {
            local name="$1" slug="$2" const="$3"; shift 3
            local dir="$RUNNER_TEMP/version-$name" out
            ./setup.sh "${FLAGS[@]}" "$@" "$dir" "$slug" >/dev/null
            (
              cd "$dir"
              local code=functions.php header=style.css
              if [ "${{ matrix.kind }}" = "plugin" ]; then
                code="$slug.php"; header="$code"
              fi
              grep -qF "define( '$const', '0.1.0' )" "$code" \
                || fail "$name: $code does not define $const"

              bash bin/build.sh --dev >/dev/null \
                || fail "$name: a fresh scaffold does not build"

              # Bump only the constant. The build must refuse it.
              sed -i.b "s/define( '$const', '0.1.0' )/define( '$const', '9.9.9' )/" "$code"
              rm -f "$code.b"
              if out=$(bash bin/build.sh --dev 2>&1); then
                fail "$name: build.sh shipped $const 9.9.9 under Version: 0.1.0"
              fi
              grep -q "version mismatch" <<<"$out" \
                || { echo "$out"; fail "$name: build failed for the wrong reason"; }

              # Bring every other copy along. The build must accept it.
              sed -i.b -E 's/^([[:space:]]*\*?[[:space:]]*Version:[[:space:]]*)0\.1\.0/\19.9.9/' "$header"
              rm -f "$header.b"
              if [ "${{ matrix.kind }}" = "plugin" ]; then
                sed -i.b 's/^Stable tag:.*/Stable tag:        9.9.9/' readme.txt
                rm -f readme.txt.b
              fi
              bash bin/build.sh --dev >/dev/null \
                || fail "$name: build.sh rejects matching 9.9.9 versions"
              [ -f "dist/$slug-9.9.9.zip" ] \
                || fail "$name: expected dist/$slug-9.9.9.zip"
            )
            echo "  $name: $const mismatch rejected, match accepted"
          }

          probe plain acme-widgets ACME_WIDGETS_VERSION
          probe digit-slug acme-widgets-2 ACME_WIDGETS_2_VERSION
          probe digit-prefix acme-widgets ACME2_W_VERSION --prefix acme2_w

      # The Text Domain lookup ran under set -euo pipefail without `|| true`, so
      # a header file with no Text Domain line aborted the build with exit 1 and
      # no message. The documented fallback never ran, and neither did the
      # missing-Version diagnostic. See issue #38. Its own scaffold, so the
      # fallback zip's name does not disturb dist/ in the main target.
      - name: Missing headers fall back or fail with a diagnostic
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = "plugin" ]; then
            FLAGS=(--plugin); HEADER=acme-widgets.php
          else
            FLAGS=(--theme "--${{ matrix.kind }}"); HEADER=style.css
          fi
          DIR="$RUNNER_TEMP/header-probe"
          ./setup.sh "${FLAGS[@]}" "$DIR" acme-widgets >/dev/null
          cd "$DIR"
          cp "$HEADER" header.keep

          fail() { echo "::error::$*"; exit 1; }

          # A theme falls back to its directory name, a plugin to its main file.
          WANT=acme-widgets
          [ "${{ matrix.kind }}" = "plugin" ] || WANT=header-probe

          # expect_fallback <label>
          expect_fallback() {
            rm -rf dist
            local out
            out=$(bash bin/build.sh --dev 2>&1) \
              || { echo "$out"; fail "$1 Text Domain: build failed"; }
            grep -q "using '$WANT' as the slug" <<<"$out" \
              || { echo "$out"; fail "$1 Text Domain: no fallback note"; }
            [ -f "dist/$WANT-0.1.0.zip" ] \
              || { ls dist; fail "$1 Text Domain: expected dist/$WANT-0.1.0.zip"; }
            echo "  $1 Text Domain: built dist/$WANT-0.1.0.zip"
          }

          sed -i.b '/Text Domain:/d' "$HEADER" && rm -f "$HEADER.b"
          expect_fallback missing

          cp header.keep "$HEADER"
          sed -i.b -E 's/(Text Domain:).*/\1/' "$HEADER" && rm -f "$HEADER.b"
          expect_fallback blank

          # No Version header must fail, and say why.
          cp header.keep "$HEADER"
          sed -i.b -E '/^[[:space:]]*\*?[[:space:]]*Version:/d' "$HEADER" && rm -f "$HEADER.b"
          if out=$(bash bin/build.sh --dev 2>&1); then
            fail "build.sh built with no Version: header"
          fi
          grep -q "no 'Version:' header" <<<"$out" \
            || { echo "$out"; fail "missing Version: failed without its diagnostic"; }
          echo "  missing Version: rejected with its diagnostic"

      # A valid custom class prefix has to reach every namespace, the PSR-4
      # map and the autoloader, and still parse. Digits and underscores are
      # the cases a naive pattern gets wrong. See issue #33.
      - name: An explicit class prefix produces valid PHP
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = "plugin" ]; then
            FLAGS=(--plugin)
          else
            FLAGS=(--theme "--${{ matrix.kind }}")
          fi
          T="$RUNNER_TEMP/class-prefix"
          ./setup.sh "${FLAGS[@]}" "$T" acme-widgets Acme_Widgets2 >/dev/null
          cd "$T"

          COUNT=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null || { echo "::error::$f does not parse"; exit 1; }
            COUNT=$((COUNT + 1))
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          [ "$COUNT" -gt 0 ] || { echo "::error::no PHP files found to lint"; exit 1; }

          grep -qF '"Acme_Widgets2\\": "includes/"' composer.json \
            || { echo "::error::PSR-4 key does not use the class prefix"; exit 1; }
          grep -q 'namespace Acme_Widgets2;' includes/Example.php \
            || { echo "::error::includes/Example.php namespace is not the class prefix"; exit 1; }
          if grep -rq 'AcmeWidgets' --include='*.php' --include='*.json' --include='*.xml.dist' .; then
            echo "::error::the slug-derived class prefix survived an explicit one"; exit 1
          fi

          # The autoloader is what proves the PSR-4 key and the namespace agree.
          composer dump-autoload -q
          php -r 'require "vendor/autoload.php"; exit(class_exists("Acme_Widgets2\\Example") ? 0 : 1);' \
            || { echo "::error::Acme_Widgets2\\Example does not autoload"; exit 1; }
          echo "Acme_Widgets2 parses in $COUNT files and autoloads."

      # An absent or blank Stable tag once built successfully: the check only
      # rejected a non-empty value that differed. Plugin Check reports that as
      # no_stable_tag, so the build produced a zip guaranteed to fail review.
      - name: A blank or missing Stable tag fails the build
        if: matrix.kind == 'plugin'
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          cp readme.txt readme.txt.keep

          sed -i.b 's/^Stable tag:.*/Stable tag:/' readme.txt && rm -f readme.txt.b
          if composer build >/dev/null 2>&1; then
            echo "::error::build.sh accepted a blank Stable tag"; exit 1
          fi

          sed -i.b '/^Stable tag:/d' readme.txt && rm -f readme.txt.b
          if composer build >/dev/null 2>&1; then
            echo "::error::build.sh accepted a missing Stable tag"; exit 1
          fi

          mv readme.txt.keep readme.txt
          composer build >/dev/null \
            || { echo "::error::build.sh rejects a correct Stable tag"; exit 1; }
          echo "Blank and missing Stable tags rejected; correct one builds."

      # check.sh swallowed the container's exit status, so a failed unzip or an
      # unreachable zip printed an empty payload and exited 0 — indistinguishable
      # from a clean plugin. Docker is too slow here, so exercise the argument
      # handling and assert the guard exists rather than running the check.
      - name: check.sh does not report success when it cannot run
        if: matrix.kind == 'plugin'
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/check.sh

          # The status must be captured, not discarded.
          grep -q 'RUN_STATUS=\$?' bin/check.sh \
            || { echo "::error::check.sh does not capture the run status"; exit 1; }
          if grep -qE '^" 2>/dev/null\) \|\| true' bin/check.sh; then
            echo "::error::check.sh still swallows the container exit status"; exit 1
          fi
          grep -qF '$TOOL did not run' bin/check.sh \
            || { echo "::error::check.sh has no failure path"; exit 1; }

          # The documented --ignore-codes workflow must be accepted. Docker is
          # absent, so this only has to get past argument parsing: a rejected
          # option exits before any Docker check with "unknown option".
          OUT=$(bash bin/check.sh --ignore-codes=some_code 2>&1) || true
          if grep -q "unknown option" <<<"$OUT"; then
            echo "::error::check.sh rejects the documented --ignore-codes option"
            echo "$OUT"; exit 1
          fi

          # --format would silently break --json parsing, so it must be refused.
          OUT=$(bash bin/check.sh --format=json 2>&1) || true
          grep -q "set by this script" <<<"$OUT" \
            || { echo "::error::check.sh accepts --format, which breaks --json"; exit 1; }
          # Forwarded values must reach the container as arguments, not spliced
          # into the script text. Interpolated, --exclude-files='x; touch /tmp/x'
          # executed touch inside the container. Fixed-string matching here:
          # the patterns are full of shell metacharacters.
          grep -qF '" sh ${PASSTHROUGH' bin/check.sh \
            || { echo "::error::check.sh does not pass forwarded options as arguments"; exit 1; }
          if grep -qF 'FIELDS ${PASSTHROUGH' bin/check.sh; then
            echo "::error::check.sh interpolates forwarded options into the container script"
            exit 1
          fi

          # An unparseable payload must not become an empty array — that reports
          # a broken run as a clean plugin.
          if grep -qF "| head -1 || echo '[]'" bin/check.sh; then
            echo "::error::check.sh still falls back to [] on unrecognised output"
            exit 1
          fi
          grep -qF "no JSON array in Plugin Check" bin/check.sh \
            || { echo "::error::check.sh has no guard for a missing JSON array"; exit 1; }
          echo "check.sh fails loudly and forwards Plugin Check options."

      # readme.txt is what wordpress.org actually reads. It is also a third
      # place the version lives, so it can drift out of sync with the header
      # while every other gate passes.
      - name: readme.txt tracks the plugin version
        if: matrix.kind == 'plugin'
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          [ -f readme.txt ] || { echo "::error::plugin scaffold has no readme.txt"; exit 1; }

          # The header block wordpress.org parses. A missing one is not a
          # warning there, it is a rejected upload.
          for field in "Contributors:" "Tags:" "Requires at least:" \
                       "Tested up to:" "Requires PHP:" "Stable tag:" "License:"; do
            grep -q "^$field" readme.txt \
              || { echo "::error::readme.txt missing '$field'"; exit 1; }
          done

          # The plugin name heading must be the renamed title, not the slug and
          # not the placeholder.
          head -1 readme.txt | grep -qx '=== Acme Widgets ===' \
            || { echo "::error::readme.txt heading is '$(head -1 readme.txt)'"; exit 1; }

          # Three files carry the version. Assert they agree, then assert
          # build.sh actually rejects a disagreement — a check nothing exercises
          # is a check that can silently stop working.
          HEADER=$(sed -nE 's/.*Version:[[:space:]]*([0-9][^[:space:]]*).*/\1/p' acme-widgets.php | head -1)
          TAG=$(sed -nE 's/^Stable tag:[[:space:]]*//p' readme.txt | tr -d '[:space:]')
          [ "$HEADER" = "$TAG" ] \
            || { echo "::error::scaffold ships Version: $HEADER but Stable tag: $TAG"; exit 1; }

          sed -i.bak 's/^Stable tag:.*/Stable tag:        9.9.9/' readme.txt
          if composer build >/dev/null 2>&1; then
            echo "::error::build.sh accepted a Stable tag that does not match the header"
            exit 1
          fi
          # "trunk" used to be idiomatic here. Plugin Check now raises it as an
          # error, so the build must reject it too rather than produce a zip
          # that fails review.
          sed -i.bak2 's/^Stable tag:.*/Stable tag:        trunk/' readme.txt
          if composer build >/dev/null 2>&1; then
            echo "::error::build.sh accepted 'Stable tag: trunk'"
            exit 1
          fi
          rm -f readme.txt.bak2
          mv readme.txt.bak readme.txt

          # "Tested up to" is stamped from wordpress.org at scaffold time. A
          # value behind the current release is an error there, and the plugin
          # drops out of search results. Assert it is a live major version, not
          # the template's placeholder.
          TESTED=$(sed -nE 's/^Tested up to:[[:space:]]*//p' readme.txt | tr -d '[:space:]')
          echo "$TESTED" | grep -qE '^[0-9]+\.[0-9]+$' \
            || { echo "::error::Tested up to is '$TESTED'; want a major version like 6.9"; exit 1; }
          CURRENT=$(curl -sS --max-time 15 \
            'https://api.wordpress.org/core/version-check/1.7/' \
            | python3 -c "import json,sys,re;print(re.match(r'(\d+\.\d+)',json.load(sys.stdin)['offers'][0]['current']).group(1))")
          [ "$TESTED" = "$CURRENT" ] \
            || { echo "::error::scaffold stamped 'Tested up to: $TESTED' but WordPress is at $CURRENT"; exit 1; }

          echo "readme.txt present, complete, version-locked, and current ($TESTED)."

      # A theme carries the same header in style.css. It went unstamped and
      # unchecked while the plugin path was covered, so every scaffolded theme
      # shipped a hardcoded value that aged out on WordPress's schedule.
      - name: Theme style.css carries a current Tested up to
        if: matrix.kind != 'plugin'
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(curl -sS --max-time 15 \
            'https://api.wordpress.org/core/version-check/1.7/' \
            | python3 -c "import json,sys,re;print(re.match(r'(\d+\.\d+)',json.load(sys.stdin)['offers'][0]['current']).group(1))")
          # A theme carries the header twice: style.css, which WordPress reads,
          # and readme.txt, which theme review requires.
          for f in style.css readme.txt; do
            TESTED=$(sed -nE 's/^Tested up to:[[:space:]]*//p' "$f" | tr -d '[:space:]')
            echo "$TESTED" | grep -qE '^[0-9]+\.[0-9]+$' \
              || { echo "::error::$f 'Tested up to' is '$TESTED'; want a major version"; exit 1; }
            [ "$TESTED" = "$CURRENT" ] \
              || { echo "::error::$f stamped 'Tested up to: $TESTED' but WordPress is at $CURRENT"; exit 1; }
          done
          echo "style.css and readme.txt Tested up to are current ($CURRENT)."

      # index.html lists excerpts. With no singular template, every post and
      # page fell back to it and showed only the first 55 words. See issue #35.
      # review-check renders one for real; this catches a dropped copy line on
      # every platform.
      - name: Block theme renders singular views in full
        if: matrix.kind == 'block'
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          [ -f templates/singular.html ] \
            || { echo "::error::block theme has no templates/singular.html"; exit 1; }
          grep -q '<!-- wp:post-content' templates/singular.html \
            || { echo "::error::singular.html has no core/post-content"; exit 1; }
          if grep -q 'wp:post-excerpt' templates/singular.html; then
            echo "::error::singular.html renders an excerpt"; exit 1
          fi
          grep -q '<!-- wp:post-excerpt' templates/index.html \
            || { echo "::error::index.html no longer lists excerpts for archives"; exit 1; }
          echo "singular.html renders post content; index.html keeps excerpts."

      # Theme review requires a readme.txt with a copyright notice and a 4:3
      # screenshot no larger than 1200x900. Theme Check fails a theme missing
      # any of them, and a fresh scaffold must not.
      - name: Theme carries what theme review requires
        if: matrix.kind != 'plugin'
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          [ -f readme.txt ] || { echo "::error::theme scaffold has no readme.txt"; exit 1; }
          head -1 readme.txt | grep -qx '=== Acme Widgets ===' \
            || { echo "::error::readme.txt heading is '$(head -1 readme.txt)'"; exit 1; }
          for field in "Requires at least:" "Tested up to:" "Requires PHP:" \
                       "License:" "License URI:"; do
            grep -q "^$field" readme.txt \
              || { echo "::error::readme.txt missing '$field'"; exit 1; }
          done
          # The year is stamped at scaffold time; YYYY means it never was.
          grep -qx "Acme Widgets WordPress Theme, (C) $(date +%Y) Your Name." readme.txt \
            || { echo "::error::readme.txt copyright line not stamped"; \
                 grep -n '(C)' readme.txt; exit 1; }
          # A theme has no Stable tag: wordpress.org serves it by style.css.
          if grep -q '^Stable tag:' readme.txt; then
            echo "::error::theme readme.txt carries a Stable tag nothing keeps in sync"; exit 1
          fi

          [ -f screenshot.png ] || { echo "::error::theme scaffold has no screenshot.png"; exit 1; }
          DIMS=$(python3 -c "
          import struct
          d = open('screenshot.png', 'rb').read(24)
          assert d[:8] == b'\x89PNG\r\n\x1a\n', 'not a PNG'
          print('%dx%d' % struct.unpack('>II', d[16:24]))
          ")
          [ "$DIMS" = "1200x900" ] \
            || { echo "::error::screenshot.png is $DIMS, want 1200x900"; exit 1; }
          # check.sh reports the placeholder by this marker. Without it, a blank
          # screenshot passes silently.
          LC_ALL=C grep -aq 'wp-preset placeholder' screenshot.png \
            || { echo "::error::screenshot.png lost the placeholder marker check.sh looks for"; exit 1; }
          echo "readme.txt and screenshot.png present and valid."

      # The unit bootstrap stubs the constants the entry point would define,
      # because unit tests never load WordPress or the entry point. Nothing
      # fails when those names drift apart — the stub just defines something
      # nothing reads, and the real name stays undefined. That is how
      # ACME_WIDGETS_PLUGIN_DIR survived in a file shared with themes.
      - name: Unit bootstrap stubs the constants the entry point defines
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          ENTRY=acme-widgets.php
          [ "${{ matrix.kind }}" = "plugin" ] || ENTRY=functions.php

          # Every constant the entry point defines and then reads itself.
          for c in $(grep -oE "define\( '[A-Z_]+'" "$ENTRY" | grep -oE "[A-Z_]{2,}"); do
            grep -q "\b$c\b" "$ENTRY" || continue
            # Only those the entry point uses to locate files matter here.
            case "$c" in *_DIR|*_URL|*_FILE) ;; *) continue ;; esac
            if grep -q "$c" tests/bootstrap-unit.php; then
              echo "  $c stubbed"
            else
              echo "  $c defined by $ENTRY but not stubbed for unit tests"
            fi
          done

          # The stub must name a constant the entry point actually defines.
          for c in $(grep -oE "defined\( '[A-Z_]+'" tests/bootstrap-unit.php | grep -oE "[A-Z_]{2,}"); do
            [ "$c" = "ABSPATH" ] && continue
            grep -q "define( '$c'" "$ENTRY" \
              || { echo "::error::bootstrap-unit.php stubs $c, which $ENTRY never defines"; exit 1; }
          done
          echo "unit bootstrap constants match ${{ matrix.kind }} entry point."

      # The integration bootstrap must load the code under test before WordPress
      # finishes booting, and the two kinds do that differently. A theme once
      # shipped the plugin loader, which required a <slug>.php it does not have,
      # so its integration tests failed on the first run. Docker is too slow to
      # run them on every leg; assert the right loader was written instead.
      - name: Integration bootstrap matches the project kind
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          B=tests/bootstrap-integration.php
          [ -f "$B" ] || { echo "::error::$B missing"; exit 1; }

          # The marker must be consumed, or setup.sh silently wrote nothing.
          if grep -q "KIND-SPECIFIC LOADER" "$B"; then
            echo "::error::bootstrap marker was never replaced"; exit 1
          fi

          if [ "${{ matrix.kind }}" = "plugin" ]; then
            grep -q "manually_load_plugin" "$B" \
              || { echo "::error::plugin bootstrap has no plugin loader"; exit 1; }
            grep -q "require dirname( __DIR__ ) . '/acme-widgets.php'" "$B" \
              || { echo "::error::plugin loader does not require the entry point"; exit 1; }
          else
            grep -q "manually_load_theme" "$B" \
              || { echo "::error::theme bootstrap has no theme loader"; exit 1; }
            grep -q "switch_theme" "$B" \
              || { echo "::error::theme loader does not switch to the theme"; exit 1; }
            # The plugin loader in a theme requires a file that does not exist.
            if grep -q "manually_load_plugin" "$B"; then
              echo "::error::theme bootstrap carries the plugin loader"; exit 1
            fi
          fi

          # The inserted fragment goes through the rename like everything else.
          if grep -qE 'wp_project|WpProject' "$B"; then
            echo "::error::placeholders survived in the inserted loader"
            grep -nE 'wp_project|WpProject' "$B"
            exit 1
          fi
          echo "bootstrap loader correct for ${{ matrix.kind }}."

      # composer check boots WordPress in Docker, which is too slow for every
      # matrix leg; the review-check job below runs it for real on Linux. What
      # breaks silently here is the wiring, so assert that on every leg.
      - name: composer check is wired for both kinds
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          [ -x bin/check.sh ] || { echo "::error::bin/check.sh missing or not executable"; exit 1; }
          bash -n bin/check.sh || { echo "::error::bin/check.sh has a syntax error"; exit 1; }
          python3 -c "
          import json,sys
          s = json.load(open('composer.json'))['scripts']
          if s.get('check') != 'bin/check.sh':
              sys.exit('composer.json check script is %r' % s.get('check'))
          " || { echo "::error::composer.json does not run bin/check.sh"; exit 1; }

          if [ "${{ matrix.kind }}" != "plugin" ]; then
            # Theme Check has no options. A Plugin Check option must be refused
            # before Docker is touched, not silently dropped: dropping it would
            # report findings the caller asked to exclude.
            OUT=$(bash bin/check.sh --ignore-codes=some_code 2>&1) && CODE=0 || CODE=$?
            if [ "$CODE" -eq 0 ] || ! grep -q "Theme Check takes none" <<<"$OUT"; then
              echo "::error::theme check.sh accepted a Plugin Check option"
              echo "$OUT"; exit 1
            fi
            # The verdict comes from a marker line, never from the bare exit
            # status, which Theme Check also uses for "theme not found".
            grep -qF 'wp-preset-theme-check-exit:' bin/check.sh \
              || { echo "::error::check.sh does not read Theme Check's verdict from the marker"; exit 1; }
            grep -qF 'Theme Check did not produce a result' bin/check.sh \
              || { echo "::error::check.sh has no guard for a missing Theme Check payload"; exit 1; }
          fi
          echo "check wiring correct for ${{ matrix.kind }}."

  # --prefix decouples the function/constant prefix from the slug. The risk is
  # a silently wrong prefix rather than a crash, so assert on generated output.
  short-prefix:
    name: --prefix decouples prefix from slug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, dom, xml, tokenizer, simplexml
          coverage: none

      - name: Scaffold with a short prefix
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/prefixed"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          ./setup.sh --prefix cartrules_otic "$TARGET" cartrules-one-tag-in-cart

      - name: Prefixes applied, text domain left alone
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN=cartrules-one-tag-in-cart.php

          grep -q "CARTRULES_OTIC_VERSION" "$MAIN" \
            || { echo "::error::constant prefix not applied"; exit 1; }
          grep -q "cartrules_otic" "$MAIN" \
            || { echo "::error::function prefix not applied"; exit 1; }

          # WordPress requires the text domain to match the directory slug, so
          # it must never follow --prefix.
          grep -q "Text Domain: *cartrules-one-tag-in-cart" "$MAIN" \
            || { echo "::error::text domain should stay slug-derived"; exit 1; }

          # The long form must not survive as a function or constant prefix.
          if grep -qE "cartrules_one_tag_in_cart_[a-z]|CARTRULES_ONE_TAG_IN_CART_" "$MAIN"; then
            echo "::error::long slug-derived prefix still present in the main file"
            exit 1
          fi

          # PrefixAllGlobals needs both: option and transient keys stay
          # slug-derived even when functions use the short prefix.
          grep -q '<element value="cartrules_otic"/>' phpcs.xml.dist \
            || { echo "::error::short prefix missing from PrefixAllGlobals"; exit 1; }
          grep -q '<element value="cartrules_one_tag_in_cart"/>' phpcs.xml.dist \
            || { echo "::error::slug prefix missing from PrefixAllGlobals"; exit 1; }

      - name: Both prefixes pass PHPCS
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress
          cat > prefix-probe.php <<'PHP'
          <?php
          /**
           * Prefix probe.
           *
           * @package CartrulesOneTagInCart
           */

          /**
           * Short-prefixed function.
           *
           * @return void
           */
          function cartrules_otic_run() {
          	// Option keys stay slug-derived, per wordpress.org convention.
          	update_option( 'cartrules_one_tag_in_cart_settings', array() );
          	set_transient( 'cartrules_one_tag_in_cart_cache', 1, 60 );
          }
          PHP
          vendor/bin/phpcs prefix-probe.php \
            || { echo "::error::PrefixAllGlobals rejects one of the two prefixes"; exit 1; }
          rm -f prefix-probe.php

      - name: Back-compat — no flag still derives from the slug
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/plain"
          ./setup.sh "$T" acme-widgets
          grep -q "ACME_WIDGETS_VERSION" "$T/acme-widgets.php" \
            || { echo "::error::default prefix changed"; exit 1; }
          grep -q '<element value="acme_widgets"/>' "$T/phpcs.xml.dist" \
            || { echo "::error::default PrefixAllGlobals changed"; exit 1; }
          # No --prefix means nothing extra is added to the prefixes array.
          # Count inside that array only; the I18n block has its own <element>.
          COUNT=$(sed -n '/name="prefixes"/,/<\/property>/p' "$T/phpcs.xml.dist" \
            | grep -c '<element value=')
          [ "$COUNT" = "2" ] \
            || { echo "::error::expected 2 prefixes without --prefix, got $COUNT"; exit 1; }

      # Bad input has to fail loudly. Each of these once produced a working
      # scaffold with silently wrong identifiers rather than an error.
      - name: Malformed arguments are rejected
        shell: bash
        run: |
          set -euo pipefail

          # Must exit non-zero AND print the expected message.
          expect_fail() {
            local want="$1"; shift
            local out status
            out=$("$@" 2>&1) && status=0 || status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::expected failure but succeeded: $*"
              exit 1
            fi
            case "$out" in
              *"$want"*) ;;
              *) echo "::error::wrong message for: $*"
                 echo "  wanted: $want"
                 echo "  got:    $out"
                 exit 1 ;;
            esac
          }

          # Equals form with no value fell through to the slug-derived prefix.
          expect_fail "--prefix needs a value" \
            ./setup.sh --prefix= "$RUNNER_TEMP/bad1" acme-widgets
          expect_fail "--prefix needs a value" \
            ./setup.sh --prefix
          # A flag after the positionals was read as the class prefix, so every
          # generated class would have been named "--prefix".
          expect_fail "options must come before" \
            ./setup.sh "$RUNNER_TEMP/bad2" acme-widgets --prefix acme_otic
          # The constant form is uppercased from this, so it must be a valid
          # PHP identifier.
          expect_fail "lowercase snake_case" \
            ./setup.sh --prefix Acme-Otic "$RUNNER_TEMP/bad3" acme-widgets
          expect_fail "cannot start with a digit" \
            ./setup.sh --prefix 9acme "$RUNNER_TEMP/bad4" acme-widgets
          expect_fail "unknown option" \
            ./setup.sh --bogus "$RUNNER_TEMP/bad5" acme-widgets
          # A theme has to be one kind or the other, and guessing silently
          # produced an invalid theme for every scaffold. See issue #15.
          expect_fail "needs --block or --classic" \
            ./setup.sh --theme "$RUNNER_TEMP/bad6" acme-theme

          # The slug is sed'd into PHP identifiers, filenames and the text
          # domain. Validating only its first character let "acme widgets"
          # through, which produced define( 'ACME WIDGETS_VERSION', ... ) — a
          # parse error — and exited 0.
          expect_fail "lowercase-kebab" \
            ./setup.sh --plugin "$RUNNER_TEMP/bad7" "acme widgets"
          expect_fail "lowercase-kebab" \
            ./setup.sh --plugin "$RUNNER_TEMP/bad8" acme_widgets
          expect_fail "lowercase-kebab" \
            ./setup.sh --plugin "$RUNNER_TEMP/bad9" acmeWidgets
          expect_fail "must start with a lowercase letter" \
            ./setup.sh --plugin "$RUNNER_TEMP/bad10" Acme-Widgets
          expect_fail "cannot end with a hyphen" \
            ./setup.sh --plugin "$RUNNER_TEMP/bad11" acme-
          expect_fail "double hyphen" \
            ./setup.sh --plugin "$RUNNER_TEMP/bad12" acme--widgets

          # The optional class prefix is sed'd into namespaces and the PSR-4
          # map. Unchecked, each of these scaffolded with exit 0 and produced
          # PHP that does not parse, or a phpcs config that fails on first run.
          # See issue #33.
          expect_fail "cannot start with a digit" \
            ./setup.sh --plugin "$RUNNER_TEMP/bad13" acme-widgets 9Bad
          expect_fail "single PHP identifier" \
            ./setup.sh --plugin "$RUNNER_TEMP/bad14" acme-widgets Acme-Widgets
          expect_fail "single PHP identifier" \
            ./setup.sh --plugin "$RUNNER_TEMP/bad15" acme-widgets 'Acme\Widgets'
          expect_fail "single PHP identifier" \
            ./setup.sh --plugin "$RUNNER_TEMP/bad16" acme-widgets 'Acme/Widgets&'
          expect_fail "is reserved" \
            ./setup.sh --plugin "$RUNNER_TEMP/bad17" acme-widgets Namespace
          expect_fail "is reserved" \
            ./setup.sh --plugin "$RUNNER_TEMP/bad18" acme-widgets WordPress
          expect_fail "at least 4 characters" \
            ./setup.sh --plugin "$RUNNER_TEMP/bad19" acme-widgets Abc
          # An unquoted space split the prefix in two and the rest was ignored.
          expect_fail "too many arguments" \
            ./setup.sh --plugin "$RUNNER_TEMP/bad20" acme-widgets Acme Widgets
          for d in bad13 bad14 bad15 bad16 bad17 bad18 bad19 bad20; do
            [ ! -e "$RUNNER_TEMP/$d" ] \
              || { echo "::error::setup.sh created $d before rejecting its class prefix"; exit 1; }
          done

          # A valid slug must still work, or the tightened rule is unusable.
          ./setup.sh --plugin "$RUNNER_TEMP/ok1" acme-widgets-2 >/dev/null \
            || { echo "::error::a valid slug was rejected"; exit 1; }

          echo "All malformed arguments rejected."

      # Stamping "Tested up to" reaches the network. Scaffolding must still
      # work without it — on a plane, in a locked-down container — and must say
      # so rather than silently leaving a value that is quietly behind.
      - name: Scaffolding works with no network
        shell: bash
        run: |
          set -euo pipefail
          FAKE="$RUNNER_TEMP/fakebin"
          mkdir -p "$FAKE"
          printf '#!/bin/sh\nexit 7\n' > "$FAKE/curl"
          chmod +x "$FAKE/curl"

          T="$RUNNER_TEMP/offline"
          OUT=$(PATH="$FAKE:$PATH" ./setup.sh --plugin "$T" acme-widgets 2>&1) \
            || { echo "::error::scaffolding failed with no network"; echo "$OUT"; exit 1; }

          # The warning is the whole mitigation: without it the project starts
          # out failing Plugin Check with nothing having said so.
          grep -q "could not reach wordpress.org" <<<"$OUT" \
            || { echo "::error::no warning when the version fetch failed"; echo "$OUT"; exit 1; }

          # The template value must still be a parseable header, not empty.
          TESTED=$(sed -nE 's/^Tested up to:[[:space:]]*//p' "$T/readme.txt" | tr -d '[:space:]')
          echo "$TESTED" | grep -qE '^[0-9]+\.[0-9]+$' \
            || { echo "::error::offline scaffold left 'Tested up to: $TESTED'"; exit 1; }

          echo "Offline scaffold warns and stays valid ($TESTED)."

  # setup.sh must not overwrite a user's existing files (AGENTS.md). One host is
  # enough: the guard is filesystem logic, not platform-specific.
  idempotence:
    name: Re-scaffold preserves existing files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scaffolding twice must not clobber
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/twice"
          ./setup.sh --plugin "$TARGET" acme-widgets >/dev/null

          echo "USER EDIT - do not overwrite" > "$TARGET/composer.json"
          ./setup.sh --plugin "$TARGET" acme-widgets >/dev/null

          grep -q 'USER EDIT' "$TARGET/composer.json" \
            || { echo "::error::setup.sh overwrote an existing file"; exit 1; }
          echo "Existing files preserved."

      # Skipping a file has to mean leaving its *contents* alone too. The
      # placeholders are ordinary strings a real project may already contain,
      # and the theme rewrites edit JSON in place.
      - name: Existing files are not rewritten either
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/preexisting"
          mkdir -p "$T"

          # Placeholder strings a user could legitimately have.
          printf '%s\n' '{"name":"vendor/wp-project","description":"my own wp_project"}' \
            > "$T/composer.json"
          # A mount list naming a sibling project, not just ".".
          printf '%s\n' '{"core":null,"plugins":[".","../shared"],"config":{"MINE":true}}' \
            > "$T/.wp-env.json"
          # A user's own editor settings must survive.
          mkdir -p "$T/.vscode"
          printf '%s\n' '{"intelephense.files.maxSize":1}' > "$T/.vscode/settings.json"

          cp "$T/.vscode/settings.json" "$RUNNER_TEMP/vscode.before"
          cp "$T/composer.json" "$RUNNER_TEMP/composer.before"
          cp "$T/.wp-env.json" "$RUNNER_TEMP/wpenv.before"

          # --theme exercises both the rename loop and the kind-specific rewrites.
          ./setup.sh --theme --block "$T" acme-theme

          diff "$RUNNER_TEMP/composer.before" "$T/composer.json" \
            || { echo "::error::setup.sh rewrote an existing composer.json"; exit 1; }
          diff "$RUNNER_TEMP/wpenv.before" "$T/.wp-env.json" \
            || { echo "::error::setup.sh rewrote an existing .wp-env.json"; exit 1; }
          diff "$RUNNER_TEMP/vscode.before" "$T/.vscode/settings.json" \
            || { echo "::error::setup.sh overwrote an existing .vscode/settings.json"; exit 1; }
          echo "Existing file contents preserved."

      - name: A fresh scaffold still gets rewritten
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/fresh"
          ./setup.sh --theme --block "$T" acme-theme >/dev/null
          grep -q '"themes"' "$T/.wp-env.json" \
            || { echo "::error::fresh theme scaffold did not get the themes mount"; exit 1; }
          grep -q '"type": "wordpress-theme"' "$T/composer.json" \
            || { echo "::error::fresh theme scaffold was not retyped"; exit 1; }
          if grep -rIqE 'wp-project|wp_project|WP_PROJECT_|WpProject' "$T"; then
            echo "::error::placeholders survived in a fresh scaffold"
            exit 1
          fi
          echo "Fresh scaffold fully rewritten."

  space-in-path:
    name: Hook runs from a path containing a space
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Claude Code runs hook commands through `sh -c`, so an unquoted
      # $CLAUDE_PROJECT_DIR splits on whitespace and the hook never formats
      # anything for a project under e.g. "~/Local Sites/". Execute the
      # command exactly as Claude Code does, from such a path.
      - name: PostToolUse hook survives a space in the project path
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/wp preset test/demo"
          ./setup.sh --theme --block "$T" acme-theme >/dev/null
          cd "$T"
          CMD=$(jq -r '.hooks.PostToolUse[0].hooks[0].command' .claude/settings.json)
          OUT=$(echo '{"tool_input":{"file_path":"functions.php"}}' \
            | CLAUDE_PROJECT_DIR="$PWD" sh -c "$CMD" 2>&1) \
            || { echo "::error::hook failed from a path with a space: $OUT"; exit 1; }
          echo "Hook ran from '$T'."

  # The wiring assertions above prove the script is in place; only running it
  # proves a fresh scaffold passes wordpress.org's own review tools. Linux only:
  # macOS runners have no Docker. The project folder is named for the slug, as
  # most checkouts are, which is the case where the unpacked theme and the
  # wp-env mount share a name.
  review-check:
    name: composer check / ${{ matrix.kind }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [plugin, block, classic]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, dom, xml, tokenizer, simplexml
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scaffold and install
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/acme-widgets"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          ./setup.sh --${{ matrix.kind }} "$TARGET" acme-widgets >/dev/null
          cd "$TARGET"
          composer install --no-interaction --no-progress -q
          npm install --no-audit --no-fund --silent

      - name: A fresh scaffold passes
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          composer check \
            || { echo "::error::a fresh ${{ matrix.kind }} scaffold fails composer check"; exit 1; }
          OUT=$(composer check -- --json 2>/dev/null) \
            || { echo "::error::composer check --json exited non-zero on a fresh scaffold"; exit 1; }
          # Plugin Check's verdict is the payload: [] means clean. Theme Check
          # always reports INFO lines, so for a theme the bar is no REQUIRED.
          python3 -c "
          import json, sys
          items = json.loads(sys.argv[1])
          bad = items if '${{ matrix.kind }}' == 'plugin' else [i for i in items if i['type'] == 'REQUIRED']
          if bad:
              sys.exit('blocking findings: %s' % bad)
          " "$OUT" || { echo "::error::fresh scaffold has blocking findings"; exit 1; }

      # Theme Check's exit status is the verdict, so prove a REQUIRED finding
      # turns into a failure in both modes rather than a printed table and a 0.
      - name: A REQUIRED finding fails the theme check
        if: matrix.kind != 'plugin'
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          mv screenshot.png "$RUNNER_TEMP/screenshot.png"
          composer check >/dev/null 2>&1 && CODE=0 || CODE=$?
          [ "$CODE" -ne 0 ] || { echo "::error::a missing screenshot did not fail composer check"; exit 1; }
          OUT=$(composer check -- --json 2>/dev/null) && CODE=0 || CODE=$?
          [ "$CODE" -ne 0 ] || { echo "::error::a missing screenshot did not fail --json"; exit 1; }
          grep -q '"REQUIRED"' <<<"$OUT" \
            || { echo "::error::--json failed without reporting the REQUIRED finding"; echo "$OUT"; exit 1; }
          mv "$RUNNER_TEMP/screenshot.png" screenshot.png
          echo "A REQUIRED finding fails both modes and is reported."

      # The static check proves singular.html ships. Only WordPress proves it
      # wins template resolution and renders the whole body. See issue #35.
      # composer check left wp-env running with the project mounted as a theme.
      - name: A block theme shows posts and pages in full
        if: matrix.kind == 'block'
        working-directory: ${{ env.TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          wp() { npx wp-env run cli wp "$@" 2>/dev/null; }

          wp theme activate acme-widgets >/dev/null
          # Well past the 55-word excerpt, with a marker only the full body has.
          WORDS=$(printf 'filler %.0s' $(seq 1 120))
          BODY="<!-- wp:paragraph --><p>${WORDS}wp-preset-full-body-end</p><!-- /wp:paragraph -->"

          for type in post page; do
            ID=$(wp post create --post_type="$type" --post_status=publish \
              --post_title="Singular $type probe" --post_content="$BODY" --porcelain | tr -d '[:space:]')
            URL=$(wp eval "echo get_permalink( $ID );" | tr -d '[:space:]')
            HTML=$(curl -fsS "$URL") || fail "$type: could not fetch $URL"
            grep -q 'wp-preset-full-body-end' <<<"$HTML" \
              || fail "$type: $URL does not show the full body"
            grep -q 'wp-block-post-content' <<<"$HTML" \
              || fail "$type: $URL did not render core/post-content"
            if grep -q 'wp-block-post-excerpt' <<<"$HTML"; then
              fail "$type: $URL rendered an excerpt"
            fi
            echo "  $type: $URL shows the full body"
          done

          # Archives keep the excerpt list.
          HOME_URL=$(wp eval 'echo home_url( "/" );' | tr -d '[:space:]')
          # Captured first: piped into grep -q, curl fails writing the rest of
          # the page once grep exits, and pipefail turns a match into a failure.
          HTML=$(curl -fsS "$HOME_URL") || fail "could not fetch $HOME_URL"
          grep -q 'wp-block-post-excerpt' <<<"$HTML" \
            || fail "the posts page no longer lists excerpts"
          echo "  archive: $HOME_URL lists excerpts"
